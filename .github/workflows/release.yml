# Push a tag like v1.0.1 -> builds the .spk and publishes a GitHub Release.
# NAS running Studio Album sees it through Package Center (source http://127.0.0.1:8686/pkg-source).
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Test
        run: |
          mkdir -p backend/web && [ -f backend/web/index.html ] || echo '<!doctype html>' > backend/web/index.html
          cd backend && go test ./...
      - name: Build package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          chmod +x build.sh
          ./build.sh "$VERSION" "$GITHUB_RUN_NUMBER" "$GITHUB_REPOSITORY"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.spk dist/release.json \
            --title "Studio Album $GITHUB_REF_NAME" --generate-notes
